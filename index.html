<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Nova Grid</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none;cursor:crosshair}
#sa{position:fixed;top:env(safe-area-inset-top,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="sa"></div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),saEl=document.getElementById('sa');
const FA=0.28,TAU=Math.PI*2,K=6,D=42,XW=6,VF=13,VR=7;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const C={ship:'#2ef2ff',pbul:'#8afcff',ridge:'#c03cff',astro:'#fff04a',ebul:'#ff5a3c'};
const ECOL=['#ff3df2','#ffa41f','#3dff8b','#ff3b4e'];
const EPTS=[100,150,200,400];

/* ---------- layout ---------- */
let W,H,DPR,CX,HZ,BY,HB,S,TOUCH_OFF,ZT,ZB,SAT=0,SAL=0,SAR=0,SAB=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  CX=W/2;HZ=H*0.16;BY=H*1.02;
  S=clamp(Math.min(W,H)*0.07,18,58);
  TOUCH_OFF=clamp(H*0.12,70,120);
  ZT=H*0.6;ZB=H-TOUCH_OFF-6;
  if(ZB<ZT+60)ZB=ZT+60;
  HB=(W/2)/(FA+(1-FA)*(ZB-HZ)/(BY-HZ)); // field reaches the screen edges at the ship's lowest row
  const r=saEl.getBoundingClientRect();SAT=r.top;SAL=r.left;SAR=W-r.right;SAB=H-r.bottom;
}
function hwS(s){return HB*(FA+(1-FA)*s);} // half-width of the field (px) at depth scale s
function project(x,d){const s=K/(d+K);return{x:CX+x/XW*hwS(s),y:HZ+(BY-HZ)*s,s};}

/* ---------- graphics helpers ---------- */
const SPR={};
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function glowSprite(col){
  let c=SPR[col];if(c)return c;
  c=document.createElement('canvas');c.width=c.height=64;
  const g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.18,hexA(col,0.95));
  gr.addColorStop(0.5,hexA(col,0.3));gr.addColorStop(1,hexA(col,0));
  g.fillStyle=gr;g.fillRect(0,0,64,64);SPR[col]=c;return c;
}
function poly(pts,x,y,r,rot,keep){
  const c=Math.cos(rot||0),s=Math.sin(rot||0);
  if(!keep)ctx.beginPath();
  for(let i=0;i<pts.length;i+=2){
    const px=pts[i]*r,py=pts[i+1]*r,X=x+px*c-py*s,Y=y+px*s+py*c;
    i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
  }
  ctx.closePath();
}
function neon(col,lw,fillA,a){
  if(a===undefined)a=1;if(a<=0)return;
  if(fillA){ctx.globalAlpha=fillA*a;ctx.fillStyle=col;ctx.fill();}
  ctx.strokeStyle=col;
  ctx.globalAlpha=0.16*a;ctx.lineWidth=lw*5;ctx.stroke();
  ctx.globalAlpha=0.4*a;ctx.lineWidth=lw*2.2;ctx.stroke();
  ctx.globalAlpha=a;ctx.lineWidth=lw;ctx.stroke();
  ctx.globalAlpha=0.7*a;ctx.strokeStyle='#ffffff';ctx.lineWidth=lw*0.4;ctx.stroke();
  ctx.globalAlpha=1;
}
function gtext(t,x,y,size,col,align,a){
  ctx.save();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=a==null?1:a;
  ctx.font=`800 ${Math.round(size)}px ui-monospace,Menlo,Consolas,"Courier New",monospace`;
  ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.shadowColor=col;ctx.shadowBlur=size*0.7;ctx.fillStyle=col;ctx.fillText(t,x,y);
  ctx.shadowBlur=0;ctx.globalAlpha*=0.35;ctx.fillStyle='#fff';ctx.fillText(t,x,y);
  ctx.restore();
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

/* ---------- shapes ---------- */
const SHIP=[0,-1.15,.28,-.3,.95,.42,.95,.6,.34,.44,.2,.66,-.2,.66,-.34,.44,-.95,.6,-.95,.42,-.28,-.3];
const COCK=[0,-.62,.13,-.2,0,-.05,-.13,-.2];
const DRONE=[0,-1,1,0,0,1,-1,0],DRONE_IN=[0,-.42,.42,0,0,.42,-.42,0];
const SWOOP=[-1,-.55,0,.05,1,-.55,.55,.35,0,1,-.55,.35];
const HEX=[],OCT=[];
for(let i=0;i<6;i++)HEX.push(Math.cos(i*TAU/6),Math.sin(i*TAU/6));
for(let i=0;i<8;i++)OCT.push(Math.cos(i*TAU/8+Math.PI/8),Math.sin(i*TAU/8+Math.PI/8));
const TRI=[0,-.45,.39,.23,-.39,.23],SQ=[-1,-1,1,-1,1,1,-1,1];
const RIDGE=[];{let h=0.4;for(let i=0;i<=80;i++){h=clamp(h+rand(-0.25,0.25),0.05,1);RIDGE.push(h);}}
const STARS=[];for(let i=0;i<90;i++)STARS.push({x:Math.random(),y:Math.random(),s:rand(0.6,1.7),p:rand(0,TAU)});

/* ---------- audio ---------- */
let AC=null,MG=null,NB=null,muted=false,unlocked=false,pendingStart=false;
try{muted=localStorage.getItem('novagrid_mute')==='1';}catch(e){}
function initAudio(){
  if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    try{AC=new A();MG=AC.createGain();MG.gain.value=muted?0:0.7;MG.connect(AC.destination);}catch(e){AC=null;return;}}
  if(AC.state!=='running'){try{AC.resume();}catch(e){}}
  if(!unlocked){try{const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);unlocked=true;}catch(e){}}
}
function toggleMute(){muted=!muted;if(MG)MG.gain.value=muted?0:0.7;try{localStorage.setItem('novagrid_mute',muted?'1':'0');}catch(e){}}
function tone(f,dur,type,vol,f2,delay){
  if(!AC||muted)return;const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';
  o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+0.05);
}
function noise(dur,vol,f){
  if(!AC||muted)return;
  if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t=AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;fl.type='lowpass';fl.frequency.setValueAtTime(f,t);fl.frequency.exponentialRampToValueAtTime(60,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(MG);s.start(t);s.stop(t+dur);
}
const SFX={
  shot(){tone(1100,0.07,'square',0.022,500);},
  hit(){tone(300,0.06,'square',0.05,150);},
  boom(big){noise(big?1.1:0.4,big?0.5:0.22,big?900:1800);tone(big?160:220,big?0.9:0.25,'sawtooth',big?0.12:0.05,40);},
  eshot(){tone(620,0.14,'triangle',0.05,260);},
  dive(){tone(900,0.35,'sine',0.03,300);},
  pick(){[660,880,1320].forEach((f,i)=>tone(f,0.12,'triangle',0.08,0,i*0.07));},
  wave(){[220,330,440,660].forEach((f,i)=>tone(f,0.16,'square',0.04,0,i*0.09));},
  clear(){[440,554,659,880,1108].forEach((f,i)=>tone(f,0.14,'triangle',0.07,0,i*0.07));},
  life(){[523,659,784,1046].forEach((f,i)=>tone(f,0.15,'triangle',0.08,0,i*0.08));}
};

/* ---------- game state ---------- */
let state='title',paused=false,score=0,hi=0,lives=3,wave=0,camZ=0,camV=0,T=0;
let enemies=[],bullets=[],ebullets=[],parts=[],pickups=[],texts=[],spawnQueue=[];
let spawnTimer=0,bannerT=0,invT=0,deadT=0,overT=0,shake=0,flashT=0,clearT=0,nextLife=10000,msg=null,newHi=false,astroN=0;
try{hi=+localStorage.getItem('novagrid_hi')||0;}catch(e){}
const ship={sx:0,sy:0,tx:0,ty:0,x:0,d:2,s:0.7,tilt:0,fireT:0};
const keys={};
const ptr={id:null,down:false,x:0,y:0};
let ctrl=(window.matchMedia&&matchMedia('(pointer:fine)').matches)?'kb':'touch';

function neutralY(){return ZT+(ZB-ZT)*0.55;}
function addScore(n){
  score+=n;
  if(score>=nextLife){lives++;nextLife+=10000;msg={t1:'+1 VITA',t2:'',col:'#fff04a',life:1.6};SFX.life();}
}
function startGame(){
  score=0;lives=3;wave=0;nextLife=10000;astroN=0;
  enemies=[];bullets=[];ebullets=[];parts=[];pickups=[];texts=[];spawnQueue=[];
  camV=0;invT=1.5;clearT=0;msg=null;state='play';paused=false;
  ship.tx=CX;ship.ty=neutralY();ship.sx=ship.tx;ship.sy=ship.ty;
  nextWave();
}
function nextWave(){
  wave++;spawnQueue=[];
  const n=Math.min(6+wave*3,42);
  for(let i=0;i<n;i++){
    const r=Math.random();let t=0;
    if(wave>=2&&r<0.3)t=1;
    if(r>0.72)t=2;
    if(wave>=4&&r>0.9)t=3;
    spawnQueue.push(t);
  }
  spawnTimer=1.5;bannerT=2.4;
  const na=Math.min(1+(wave>>1),3);
  for(let i=0;i<na;i++)pickups.push({x:rand(-XW+1,XW-1),z:camZ+D+8+i*16+rand(0,8),t:rand(0,6)});
  SFX.wave();
}
function spawnEnemy(type,x,z){
  enemies.push({type,x,z,t:0,ph:rand(0,TAU),hp:type===3?4:(type===2?2:1),enter:true,st:0,
    cool:type===1?rand(1.5,3.5):rand(0.6,1.8),hd:type===1?rand(14,22):rand(13,24),vx:0,flash:0,dead:false});
}
function respawnFar(e){e.z=camZ+D+5+rand(0,8);e.x=rand(-XW+1,XW-1);e.enter=true;e.st=0;e.cool=e.type===1?rand(1.5,3.5):rand(0.6,1.8);}

function explode(x,z,col,n,big){
  for(let i=0;i<n;i++){
    const a=rand(0,TAU),sp=rand(1.5,6.5)*big;
    parts.push({x,z,h:0.6,vx:Math.cos(a)*sp*0.6,vz:Math.sin(a)*sp*0.6,vh:rand(1,6)*big,life:1,dec:rand(0.8,1.7),size:rand(0.5,1.2)*big,col:Math.random()<0.25?'#ffffff':col});
  }
  parts.push({ring:true,x,z,life:1,dec:1.6,col,big});
  if(parts.length>700)parts.splice(0,parts.length-700);
}
function killEnemy(e,byPlayer){
  if(e.dead)return;e.dead=true;const big=e.type===3;
  explode(e.x,e.z,ECOL[e.type],big?40:24,big?1.5:1);SFX.boom(false);
  if(big)shake=Math.max(shake,0.25);
  if(byPlayer){const p=EPTS[e.type];addScore(p);texts.push({x:e.x,z:e.z,t:''+p,life:1,col:ECOL[e.type]});}
}
function hitEnemy(e){
  e.hp--;e.flash=0.08;
  if(e.hp<=0)killEnemy(e,true);
  else{SFX.hit();for(let i=0;i<6;i++)parts.push({x:e.x,z:e.z,h:0.6,vx:rand(-3,3),vz:rand(-3,3),vh:rand(1,4),life:0.7,dec:2,size:0.6,col:'#ffffff'});}
}
function killPlayer(){
  if(invT>0||state!=='play')return;
  const z=camZ+ship.d;
  explode(ship.x,z,C.ship,60,1.8);explode(ship.x,z,'#ffffff',20,1.2);
  SFX.boom(true);lives--;state='dead';deadT=2.2;shake=0.7;flashT=0.35;ebullets.length=0;
}
function respawn(){
  state='play';invT=2.5;camV=0;
  ship.tx=CX;ship.ty=neutralY();ship.sx=CX;ship.sy=ship.ty;
  for(const e of enemies)if(e.z-camZ<16)respawnFar(e);
  ebullets.length=0;
}
function gameOver(){
  state='over';overT=0;newHi=false;
  if(score>hi){hi=score;newHi=true;try{localStorage.setItem('novagrid_hi',String(hi));}catch(e){}}
}
function enemyShoot(e,d,spread){
  const dx=ship.x-e.x,dz=ship.d-d,len=Math.hypot(dx,dz)||1,spd=Math.min(15,7.5+wave*0.35);
  for(let k=-spread;k<=spread;k++){
    const a=k*0.2,c=Math.cos(a),s=Math.sin(a),ux=dx/len,uz=dz/len;
    ebullets.push({x:e.x,z:e.z,vx:(ux*c-uz*s)*spd,vz:(ux*s+uz*c)*spd});
  }
  SFX.eshot();
}

/* ---------- update ---------- */
function updateShip(dt){
  if(ctrl==='kb'){
    const dx=((keys.ArrowRight||keys.KeyD)?1:0)-((keys.ArrowLeft||keys.KeyA)?1:0);
    const dy=((keys.ArrowDown||keys.KeyS)?1:0)-((keys.ArrowUp||keys.KeyW)?1:0);
    ship.tx+=dx*W*0.8*dt;
    if(dy)ship.ty+=dy*(ZB-ZT)*1.8*dt;else ship.ty+=(neutralY()-ship.ty)*clamp(dt*4,0,1);
  }else if(ctrl==='touch'&&!ptr.down){
    ship.ty+=(neutralY()-ship.ty)*clamp(dt*2.5,0,1);
  }
  ship.ty=clamp(ship.ty,ZT,ZB);
  const st=(ship.ty-HZ)/(BY-HZ),lim=Math.min(hwS(st)*(XW-0.4)/XW,W/2-S*0.75);
  ship.tx=clamp(ship.tx,CX-lim,CX+lim);
  const k=clamp(dt*16,0,1),ox=ship.sx;
  ship.sx+=(ship.tx-ship.sx)*k;ship.sy+=(ship.ty-ship.sy)*k;
  const vx=dt>0?(ship.sx-ox)/dt:0;
  ship.tilt+=(clamp(vx/(W*1.2),-0.35,0.35)-ship.tilt)*clamp(dt*10,0,1);
  const s=(ship.sy-HZ)/(BY-HZ);ship.s=s;ship.d=K/s-K;ship.x=(ship.sx-CX)/hwS(s)*XW;
}

function update(dt){
  T+=dt;
  updateShip(dt);
  if(state==='play'){
    const u=(ship.sy-ZT)/(ZB-ZT);let tv=0;
    if(u<0.48)tv=(0.48-u)/0.48*VF;else if(u>0.62)tv=-(u-0.62)/0.38*VR;
    camV+=(tv-camV)*clamp(dt*3,0,1);
  }else if(state==='dead')camV+=(0-camV)*clamp(dt*2,0,1);
  else camV+=(4-camV)*clamp(dt,0,1);
  camZ+=camV*dt;

  if(state==='play'||state==='dead'){
    // spawn: always far beyond the horizon, never near the player
    const maxActive=Math.min(6+wave*1.5,18);
    if(spawnQueue.length){
      spawnTimer-=dt;
      if(spawnTimer<=0&&enemies.length<maxActive){
        const n=Math.min(spawnQueue.length,1+(Math.random()*3|0)),z=camZ+D+5+rand(0,6),bx=rand(-XW+1.8,XW-1.8);
        for(let i=0;i<n;i++)spawnEnemy(spawnQueue.pop(),clamp(bx+(i-(n-1)/2)*1.6,-XW+0.6,XW-0.6),z+i*0.8);
        spawnTimer=Math.max(0.5,1.6-wave*0.08)+rand(0,0.8);
      }
    }
    updateEnemies(dt);
    updatePickups(dt);
    updateBullets(dt);
    // fire
    ship.fireT-=dt;
    const firing=keys.Space||keys.KeyJ||keys.KeyZ||keys.KeyK||ptr.down;
    if(state==='play'&&firing&&ship.fireT<=0){
      ship.fireT=0.13;
      const z=camZ+ship.d+0.5;
      bullets.push({x:ship.x,z,pz:z,z0:z,vz:52+Math.max(0,camV)});
      SFX.shot();
    }
    if(state==='dead'){deadT-=dt;if(deadT<=0){if(lives>0)respawn();else gameOver();}}
    if(state==='play'&&!spawnQueue.length&&!enemies.length&&clearT<=0&&bannerT<=0){
      clearT=2.4;const b=wave*500;addScore(b);
      msg={t1:'ONDATA SUPERATA',t2:'BONUS +'+b,col:'#3dff8b',life:2.2};SFX.clear();
    }
    if(clearT>0){clearT-=dt;if(clearT<=0)nextWave();}
  }
  if(state==='over')overT+=dt;
  invT=Math.max(0,invT-dt);bannerT=Math.max(0,bannerT-dt);shake=Math.max(0,shake-dt*1.6);flashT=Math.max(0,flashT-dt);
  if(msg){msg.life-=dt;if(msg.life<=0)msg=null;}
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=p.dec*dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    if(!p.ring){p.x+=p.vx*dt;p.z+=p.vz*dt;p.h+=p.vh*dt;p.vh-=9*dt;if(p.h<0){p.h=0;p.vh*=-0.45;p.vx*=0.7;p.vz*=0.7;}}
  }
  for(let i=texts.length-1;i>=0;i--){texts[i].life-=dt*0.9;if(texts[i].life<=0)texts.splice(i,1);}
}

function updateEnemies(dt){
  const sp=1+Math.min(wave,20)*0.06;
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.dead){enemies.splice(i,1);continue;}
    e.t+=dt;if(e.flash>0)e.flash-=dt;
    let d=e.z-camZ;
    if(e.enter){
      e.z-=14*dt;if(e.z-camZ<D-3)e.enter=false;
    }else switch(e.type){
      case 0: // drone: approaches and homes in
        e.z-=2.4*sp*dt;
        e.x+=(Math.sin(e.t*1.8+e.ph)*1.8+clamp(ship.x-e.x,-1,1)*1.3*sp)*dt;
        e.cool-=dt;if(e.cool<=0&&state==='play'&&d<D-4&&d>ship.d+5){e.cool=rand(2,3.5)/(1+wave*0.06);enemyShoot(e,d,0);}
        break;
      case 1: // swooper: hovers then dives at the player
        if(e.st===0){
          e.z+=(camZ+e.hd-e.z)*clamp(1.6*dt,0,1);
          e.x+=Math.cos(e.t*1.7+e.ph)*3.5*dt;
          e.cool-=dt;
          if(e.cool<=0&&state==='play'){
            e.st=1;const tt=Math.max(0.3,(d-ship.d)/(15*sp));
            e.vx=clamp((ship.x-e.x)/tt,-7,7);SFX.dive();
            if(d>ship.d+5)enemyShoot(e,d,0);
          }
        }else{e.z-=15*sp*dt;e.x+=e.vx*dt;}
        break;
      case 2: // shooter: keeps distance and fires
        e.z+=(camZ+e.hd-e.z)*clamp(1.2*dt,0,1);
        e.x+=Math.cos(e.t*1.1+e.ph)*3*dt;
        e.cool-=dt;
        if(e.cool<=0&&state==='play'&&d<D-3&&d>ship.d+4){e.cool=rand(1.2,2.2)/(1+wave*0.05);enemyShoot(e,d,wave>=4&&Math.random()<0.3?1:0);}
        break;
      case 3: // heavy: slow, armored
        e.z-=1.5*sp*dt;
        e.x+=clamp(ship.x-e.x,-1,1)*0.8*dt;
        if(wave>=3){e.cool-=dt;if(e.cool<=0&&state==='play'&&d<D-3&&d>ship.d+5){e.cool=rand(2.4,3.8);enemyShoot(e,d,1);}}
        break;
    }
    if(e.x<-XW+0.7){e.x=-XW+0.7;e.vx=Math.abs(e.vx);}
    if(e.x>XW-0.7){e.x=XW-0.7;e.vx=-Math.abs(e.vx);}
    d=e.z-camZ;
    if(d<-3)respawnFar(e);              // passed the player: comes back from the top
    else if(d>D+30){e.z=camZ+D+8;e.enter=true;}
    if(state==='play'&&invT<=0&&!e.enter&&Math.abs(d-ship.d)<2.5){
      const p=project(e.x,d),r=S*p.s*(e.type===3?1.35:1);
      if(Math.hypot(p.x-ship.sx,(p.y-r*0.6)-(ship.sy-S*0.3))<r*0.65+S*0.42){killEnemy(e,false);killPlayer();}
    }
  }
}
function updatePickups(dt){
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];p.t+=dt;p.z-=1.2*dt;
    const d=p.z-camZ;
    if(d<-2){pickups.splice(i,1);continue;}
    if(state==='play'&&Math.abs(d-ship.d)<2&&d<D){
      const q=project(p.x,d);
      if(Math.hypot(q.x-ship.sx,(q.y-S*q.s*0.9)-(ship.sy-S*0.3))<S*0.95){
        pickups.splice(i,1);astroN++;const b=500*astroN;addScore(b);invT=Math.max(invT,3);
        texts.push({x:p.x,z:p.z,t:'SALVATO +'+b,life:1.4,col:C.astro});SFX.pick();
        explode(p.x,p.z,C.astro,16,0.8);
      }
    }
  }
}
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.pz=b.z;b.z+=b.vz*dt;
    if(b.z-camZ>D+4){bullets.splice(i,1);continue;}
    for(const e of enemies){
      if(e.dead)continue;const d=e.z-camZ;if(d>D+1)continue;
      const es=K/(Math.max(d,0)+K),hw=S*es*XW/hwS(es)*0.8*(e.type===3?1.35:1)+0.1;
      if(Math.abs(e.x-b.x)<hw&&e.z>b.pz-0.6&&e.z<b.z+0.6){hitEnemy(e);b.dead=true;break;}
    }
    if(b.dead)bullets.splice(i,1);
  }
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];b.x+=b.vx*dt;b.z+=b.vz*dt;
    const d=b.z-camZ;
    if(d<-2||d>D+6||Math.abs(b.x)>XW+2){ebullets.splice(i,1);continue;}
    if(state==='play'&&invT<=0&&Math.abs(d-ship.d)<1.5){
      const p=project(b.x,d);
      if(Math.hypot(p.x-ship.sx,(p.y-S*p.s*0.6)-(ship.sy-S*0.3))<S*0.38){killPlayer();break;}
    }
  }
}

/* ---------- drawing ---------- */
function drawBG(){
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  let g=ctx.createLinearGradient(0,0,0,HZ);g.addColorStop(0,'#01000a');g.addColorStop(1,'#1d0638');
  ctx.fillStyle=g;ctx.fillRect(-40,-40,W+80,HZ+40);
  const par=ship.x/XW*W*0.02;ctx.fillStyle='#cfe6ff';
  for(const st of STARS){
    const x=((st.x*W-par)%W+W)%W,y=st.y*HZ*0.9;
    ctx.globalAlpha=0.35+0.65*Math.abs(Math.sin(T*1.5+st.p));ctx.fillRect(x,y,st.s,st.s);
  }
  ctx.globalAlpha=1;
  // striped sun
  const R=Math.min(W,H)*0.13;
  ctx.save();ctx.beginPath();ctx.rect(CX-R,HZ-R,R*2,R*0.5);
  let y=HZ-R*0.5,gap=R*0.025;while(y<HZ){const hh=R*0.1;ctx.rect(CX-R,y+gap,R*2,hh-gap);y+=hh;gap+=R*0.012;}
  ctx.clip();
  g=ctx.createLinearGradient(0,HZ-R,0,HZ);g.addColorStop(0,'#ffe85a');g.addColorStop(0.5,'#ff6a3c');g.addColorStop(1,'#ff2fa8');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,HZ,R,Math.PI,TAU);ctx.fill();ctx.restore();
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.35;
  ctx.drawImage(glowSprite('#ff3cae'),CX-R*2.2,HZ-R*1.8,R*4.4,R*2.6);ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  // ridge
  const n=RIDGE.length-1,span=W*1.6,off=-W*0.3-ship.x/XW*W*0.04,rh=Math.min(H*0.06,60);
  ctx.beginPath();ctx.moveTo(off,HZ);
  for(let i=0;i<=n;i++)ctx.lineTo(off+i/n*span,HZ-RIDGE[i]*rh);
  ctx.lineTo(off+span,HZ);ctx.closePath();ctx.fillStyle='#07021a';ctx.fill();
  // ground
  g=ctx.createLinearGradient(0,HZ,0,H);g.addColorStop(0,'#160640');g.addColorStop(0.12,'#06021c');g.addColorStop(1,'#020a1c');
  ctx.fillStyle=g;ctx.fillRect(-40,HZ,W+80,H-HZ+40);
  ctx.globalCompositeOperation='lighter';ctx.lineJoin='round';
  ctx.beginPath();for(let i=0;i<=n;i++){const X=off+i/n*span,Y=HZ-RIDGE[i]*rh;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}
  ctx.strokeStyle=C.ridge;ctx.globalAlpha=0.25;ctx.lineWidth=5;ctx.stroke();ctx.globalAlpha=1;ctx.lineWidth=1.3;ctx.stroke();
  g=ctx.createLinearGradient(0,HZ-14,0,HZ+14);
  g.addColorStop(0,'rgba(255,60,200,0)');g.addColorStop(0.5,'rgba(255,80,220,0.55)');g.addColorStop(1,'rgba(255,60,200,0)');
  ctx.fillStyle=g;ctx.fillRect(-40,HZ-14,W+80,28);
}
function drawGrid(){
  ctx.lineCap='butt';
  const z0=Math.floor(camZ/2)*2;
  for(let z=z0;z-camZ<=D;z+=2){
    const d=z-camZ,s=K/(d+K),y=HZ+(BY-HZ)*s;if(y>H+6)continue;
    const xl=CX-hwS(s),xr=CX+hwS(s),a=clamp(s*1.5,0.08,1);
    ctx.beginPath();ctx.moveTo(xl,y);ctx.lineTo(xr,y);
    ctx.strokeStyle=`rgba(42,107,255,${0.16*a})`;ctx.lineWidth=6*s+1;ctx.stroke();
    ctx.strokeStyle=`rgba(100,160,255,${0.75*a})`;ctx.lineWidth=Math.max(0.7,1.6*s);ctx.stroke();
  }
  const sN=K/(K-1),yN=HZ+(BY-HZ)*sN,sF=K/(D+K),yF=HZ+(BY-HZ)*sF;
  let g=ctx.createLinearGradient(0,yF,0,H);
  g.addColorStop(0,'rgba(42,107,255,0)');g.addColorStop(0.3,'rgba(60,120,255,0.45)');g.addColorStop(1,'rgba(100,160,255,0.9)');
  ctx.beginPath();
  for(let x=-XW+1;x<=XW-1;x++){ctx.moveTo(CX+x/XW*hwS(sF),yF);ctx.lineTo(CX+x/XW*hwS(sN),yN);}
  ctx.strokeStyle=g;ctx.globalAlpha=0.25;ctx.lineWidth=5;ctx.stroke();ctx.globalAlpha=1;ctx.lineWidth=1.2;ctx.stroke();
  g=ctx.createLinearGradient(0,yF,0,H);g.addColorStop(0,'rgba(46,242,255,0)');g.addColorStop(0.35,'rgba(46,242,255,0.6)');g.addColorStop(1,'rgba(46,242,255,1)');
  ctx.beginPath();
  for(const x of [-XW,XW]){ctx.moveTo(CX+x/XW*hwS(sF),yF);ctx.lineTo(CX+x/XW*hwS(sN),yN);}
  ctx.strokeStyle=g;ctx.globalAlpha=0.25;ctx.lineWidth=9;ctx.stroke();ctx.globalAlpha=1;ctx.lineWidth=2;ctx.stroke();
  ctx.lineCap='round';
}
function drawEnemy(e){
  if(e.dead)return;
  const d=e.z-camZ;if(d>D+6||d<-2)return;
  const a=clamp((D+6-d)/6,0,1),p=project(e.x,d),big=e.type===3?1.35:1,r=S*p.s*big;
  const x=p.x,y=p.y-r*0.6+Math.sin(e.t*3+e.ph)*r*0.12;
  const col=e.flash>0?'#ffffff':ECOL[e.type],lw=Math.max(1,r*0.07);
  ctx.globalAlpha=0.3*a;ctx.drawImage(glowSprite(ECOL[e.type]),x-r,p.y-r*0.2,r*2,r*0.4);ctx.globalAlpha=1;
  switch(e.type){
    case 0:
      poly(DRONE,x,y,r,e.t*2);neon(col,lw,0.15,a);
      poly(DRONE_IN,x,y,r,-e.t*3);neon(col,lw*0.8,0,a);break;
    case 1:
      poly(SWOOP,x,y,r,e.st===1?-clamp(e.vx*0.08,-0.6,0.6):Math.sin(e.t*3)*0.2);neon(col,lw,0.15,a);break;
    case 2:{
      poly(HEX,x,y,r,e.t*0.8);neon(col,lw,0.12,a);
      poly(TRI,x,y,r,-e.t*2);neon(col,lw*0.8,0,a);
      const pr=r*(0.5+(e.cool<0.5?(0.5-e.cool)*1.4:0));
      ctx.globalAlpha=a;ctx.drawImage(glowSprite(col),x-pr,y-pr,pr*2,pr*2);ctx.globalAlpha=1;break;}
    case 3:
      poly(OCT,x,y,r,e.t*0.5);neon(col,lw*1.2,0.15,a);
      poly(SQ,x,y,r*0.5,-e.t*1.5);neon(col,lw,0,a);
      for(let i=0;i<e.hp;i++){ctx.globalAlpha=a;const px=x+(i-(e.hp-1)/2)*r*0.35,s=r*0.22;ctx.drawImage(glowSprite('#ffffff'),px-s,y+r*1.3-s,s*2,s*2);}
      ctx.globalAlpha=1;break;
  }
}
function drawAstro(pk){
  const d=pk.z-camZ;if(d>D+4||d<-2)return;
  const a=clamp((D+4-d)/5,0,1),p=project(pk.x,d),r=S*p.s*0.85,x=p.x,y=p.y-r*0.95+Math.sin(pk.t*2.5)*r*0.12,lw=Math.max(1,r*0.07);
  const wv=Math.sin(pk.t*6)*r*0.25;
  ctx.beginPath();ctx.arc(x,y-r*0.55,r*0.24,0,TAU);
  ctx.moveTo(x,y-r*0.3);ctx.lineTo(x,y+r*0.25);
  ctx.moveTo(x-r*0.45,y-r*0.25+wv);ctx.lineTo(x,y-r*0.1);ctx.lineTo(x+r*0.45,y-r*0.25-wv);
  ctx.moveTo(x-r*0.32,y+r*0.75);ctx.lineTo(x,y+r*0.25);ctx.lineTo(x+r*0.32,y+r*0.75);
  neon(C.astro,lw,0,a);
  const pu=0.7+0.3*Math.sin(pk.t*4);
  ctx.beginPath();ctx.ellipse(x,p.y,r*pu,r*0.28*pu,0,0,TAU);neon(C.astro,lw*0.7,0,a*0.6);
}
function drawShipAt(x,y,r,rot,a,thr){
  if(thr>=0){
    const fl=(0.55+Math.random()*0.35)+thr*0.9;
    ctx.globalAlpha=0.9*a;
    ctx.drawImage(glowSprite('#3c9bff'),x-r*0.45,y+r*0.35,r*0.9,r*0.9*fl*1.3);
    ctx.drawImage(glowSprite('#ffffff'),x-r*0.18,y+r*0.5,r*0.36,r*0.36*fl);
    ctx.globalAlpha=1;
  }
  poly(SHIP,x,y,r,rot);neon(C.ship,Math.max(1.3,r*0.06),0.15,a);
  poly(COCK,x,y,r,rot);neon('#ffffff',Math.max(1,r*0.04),0.3,a);

function drawShip(){
  if(state==='dead'||state==='over')return;
  const x=ship.sx,y=ship.sy-S*0.3,r=S*0.85;
  // touch guide: finger ring + link, so the ship is always visible above the finger
  if(ctrl==='touch'&&ptr.down){
    ctx.beginPath();ctx.arc(ptr.x,ptr.y,S*0.55,0,TAU);neon(C.ship,1,0,0.35);
    ctx.beginPath();ctx.moveTo(ptr.x,ptr.y-S*0.55);ctx.lineTo(x,y+r*0.7);neon(C.ship,1,0,0.2);
  }
  ctx.globalAlpha=0.35;ctx.drawImage(glowSprite(C.ship),x-r,ship.sy+S*0.15,r*2,r*0.45);ctx.globalAlpha=1;
  const blink=invT>0&&state==='play'?(0.45+0.55*Math.abs(Math.sin(T*14))):1;
  drawShipAt(x,y,r,ship.tilt,blink,clamp(camV/VF,0,1));
  if(invT>0&&state==='play'){ctx.beginPath();ctx.arc(x,y,r*1.35,0,TAU);neon('#7fd8ff',1.2,0.04,0.5*Math.min(1,invT));}

function drawWorld(){
  ctx.globalCompositeOperation='lighter';ctx.lineJoin='round';ctx.lineCap='round';
  for(const pk of pickups)drawAstro(pk);
  enemies.sort((a,b)=>b.z-a.z);
  for(const e of enemies)drawEnemy(e);
  for(const b of ebullets){
    const d=b.z-camZ;if(d>D+6)continue;
    const p=project(b.x,d),r=Math.max(6,S*p.s*0.45),y=p.y-S*p.s*0.6;
    ctx.drawImage(glowSprite(C.ebul),p.x-r*1.6,y-r*1.6,r*3.2,r*3.2);
    ctx.drawImage(glowSprite('#ffffff'),p.x-r*0.5,y-r*0.5,r,r);
  }
  for(const b of bullets){
    const d=b.z-camZ;if(d>D+3)continue;
    const d2=Math.max(b.z-1.8,b.z0)-camZ,p1=project(b.x,d),p2=project(b.x,d2);
    ctx.beginPath();ctx.moveTo(p1.x,p1.y-S*p1.s*0.6);ctx.lineTo(p2.x,p2.y-S*p2.s*0.6);
    neon(C.pbul,Math.max(1.5,S*p1.s*0.09),0,1);
  }
  drawShip();
  for(const p of parts){
    const d=p.z-camZ;if(d<-K+0.8||d>D+8)continue;
    const pr=project(p.x,d);
    if(p.ring){const R=S*pr.s*p.big*(0.5+(1-p.life)*3.2);ctx.beginPath();ctx.ellipse(pr.x,pr.y,R,R*0.32,0,0,TAU);neon(p.col,Math.max(1,S*pr.s*0.05),0,p.life*0.8);continue;}
    const sz=S*pr.s*0.5*p.size*(0.4+p.life),y=pr.y-p.h*S*pr.s;
    ctx.globalAlpha=Math.min(1,p.life*1.3);ctx.drawImage(glowSprite(p.col),pr.x-sz,y-sz,sz*2,sz*2);
  }
  ctx.globalAlpha=1;
  for(const t of texts){
    const d=t.z-camZ;if(d<-K+0.8)continue;
    const p=project(t.x,d);
    gtext(t.t,p.x,p.y-S*p.s*1.3-(1-t.life)*30,Math.max(11,S*0.38),t.col,'center',Math.min(1,t.life*1.5));
  }
}

  if(c==='KeyP'||c==='Escape'){if(state==='play'||state==='dead')paused=!paused;}
  else if(c==='KeyM')toggleMute();
  else if(c==='Space'||c==='Enter'){
    if(paused)paused=false;
    else if(state==='title'||(state==='over'&&overT>1.2))startGame();
  }
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;ptr.down=false;ptr.id=null;if(state==='play'||state==='dead')paused=true;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='play'||state==='dead'))paused=true;});

function setTarget(){ship.tx=ptr.x;ship.ty=ctrl==='touch'?ptr.y-TOUCH_OFF:ptr.y;}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();
  const x=e.clientX,y=e.clientY,R=btnRects();
  if(inR(R.mute,x,y)){toggleMute();return;}
  if((state==='play'||state==='dead')&&inR(R.pause,x,y)){paused=!paused;return;}
  if(paused){paused=false;return;}
  const isTouch=e.pointerType!=='mouse';
  if(isTouch&&ptr.down&&ptr.id!==null)return; // ignore extra fingers
  if(state==='title'||state==='over'){
    // mobile browsers unlock audio only when the finger lifts: start on release
    if(isTouch){pendingStart=true;return;}
    if(state==='title'||overT>1.2)startGame();
  }
  ctrl=isTouch?'touch':'mouse';
  ptr.id=e.pointerId;ptr.down=true;ptr.x=x;ptr.y=y;setTarget();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){
    ctrl='mouse';ptr.x=e.clientX;ptr.y=e.clientY;setTarget();
  }else if(e.pointerId===ptr.id&&ptr.down){
    ptr.x=e.clientX;ptr.y=e.clientY;setTarget();
  }
});
function endPtr(e){if(e.pointerId===ptr.id||e.pointerType==='mouse'){ptr.down=false;ptr.id=null;}}
cv.addEventListener('pointerup',e=>{
  endPtr(e);
  if(pendingStart){pendingStart=false;initAudio();if(state==='title'||(state==='over'&&overT>1.2))startGame();}
});
['pointerup','touchend','click','keyup'].forEach(t=>addEventListener(t,initAudio,{passive:true}));
cv.addEventListener('pointercancel',e=>{endPtr(e);pendingStart=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- boot ---------- */
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,200));
resize();
ship.tx=ship.sx=CX;ship.ty=ship.sy=neutralY();
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  if(!paused)update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
